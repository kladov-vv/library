<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Library</title>
</head>
<body>
    <div class="container">
        <dialog closedby="any">
            <form method="dialog">
                <div class="input-wrapper">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" autocomplete="off" required>
                </div>
                <div class="input-wrapper">
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author" autocomplete="off" required>
                </div>
                <div class="input-wrapper">    
                    <label for="pages">Pages:</label>
                    <input type="text" id="pages" name="pages" autocomplete="off" pattern="^(?!0)\d+$" required>
                </div>
                <div class="input-wrapper">
                    <label for="status">Did you read this book?:</label>
                    <input type="checkbox" id="status" name="status">
                </div>
                <button class="btn-submit-form">Confirm</button>
                <button type="button" class="btn-close-dialog btn-icon">
                    <img src="icons/close-icon.svg" alt="close icon">
                </button>
            </form>
        </dialog>
        <div class="header">
            <h1>My Library</h1>
            <button class="btn-add-book">New Book</button>
        </div>
        <div class="library-board"></div>
    </div>
</body>
</html>
